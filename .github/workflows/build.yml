name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvpx-dev libx11-dev libxcb1-dev \
            libxcb-shm0-dev pkg-config libasound2-dev libopus-dev \
            protobuf-compiler libclang-dev dpkg \
            libglib2.0-dev libgtk-3-dev libxdo-dev \
            libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev libdbus-1-dev libgbm-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install libvpx protobuf opus pkg-config

      - name: Build
        run: cargo build --release --bin rd-desktop --bin rd-agent --bin rd-viewer --bin rd-relay

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/release/rd-desktop dist/RemoteDesktop-linux-x86_64
          cp target/release/rd-agent dist/rd-agent-linux-x86_64
          cp target/release/rd-viewer dist/rd-viewer-linux-x86_64
          chmod +x installer/linux/build-deb.sh
          bash installer/linux/build-deb.sh || true
          cp dist/linux/*.deb dist/ 2>/dev/null || true

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          cp target/release/rd-desktop dist/RemoteDesktop-macos-aarch64
          chmod +x installer/macos/create-dmg.sh
          bash installer/macos/create-dmg.sh || true
          cp dist/macos/*.dmg dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Install LLVM
        run: choco install llvm protoc -y
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-static-v2
      - name: Install vcpkg dependencies
        run: |
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\lib\vpx.lib")) {
            cd C:\vcpkg
            git pull 2>$null
            .\bootstrap-vcpkg.bat
            .\vcpkg install libvpx:x64-windows-static opus:x64-windows-static
          }
          $libDir = "C:\vcpkg\installed\x64-windows-static\lib"
          if ((Test-Path "$libDir\vpx.lib") -and -not (Test-Path "$libDir\libvpx.lib")) {
            Copy-Item "$libDir\vpx.lib" "$libDir\libvpx.lib"
          }
        shell: pwsh
      - name: Build
        run: cargo build --release --bin rd-desktop --bin rd-agent --bin rd-viewer --bin rd-relay
        env:
          VPX_LIB_DIR: C:\vcpkg\installed\x64-windows-static\lib
          VPX_INCLUDE_DIR: C:\vcpkg\installed\x64-windows-static\include
          VPX_VERSION: "1.13.0"
          VPX_STATIC: "1"
          VPX_NO_PKG_CONFIG: "1"
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\lib"
      - name: Package
        run: |
          mkdir dist
          copy target\release\rd-desktop.exe dist\RemoteDesktop-windows-x86_64.exe
          copy target\release\rd-agent.exe dist\rd-agent-windows-x86_64.exe
          copy target\release\rd-viewer.exe dist\rd-viewer-windows-x86_64.exe
        shell: cmd
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  release:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Remote Desktop ${{ github.ref_name }}"
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | **Windows** | `RemoteDesktop-windows-x86_64.exe` |
            | **macOS** | `RemoteDesktop-0.1.0-macOS.dmg` |
            | **Linux** | `RemoteDesktop-linux-x86_64` or `remote-desktop_0.1.0_amd64.deb` |

            ## Install

            **Windows**: Download the `.exe` and run it. Or:
            ```powershell
            irm https://raw.githubusercontent.com/vdhushetty/RemoteDesktop/main/installer/install.ps1 | iex
            ```

            **macOS**: Download the `.dmg`, open it, drag to Applications.

            **Linux**: Download the `.deb` and `sudo dpkg -i` it, or:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vdhushetty/RemoteDesktop/main/installer/install.sh | bash
            ```

            ## Usage
            1. Run **Remote Desktop** on both machines
            2. Copy the **Device ID** from the machine you want to control
            3. Paste it in the **Connect** field on the other machine
            4. Click **Connect**
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
