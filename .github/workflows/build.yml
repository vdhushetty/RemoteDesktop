name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvpx-dev libx11-dev libxcb1-dev \
            libxcb-shm0-dev pkg-config libasound2-dev libopus-dev \
            protobuf-compiler

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install libvpx protobuf opus pkg-config

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install protoc

      - name: Build
        run: cargo build --release --bin rd-agent --bin rd-viewer --bin rd-relay

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/rd-agent${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            target/release/rd-viewer${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            target/release/rd-relay${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | head -20
