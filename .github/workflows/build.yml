name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvpx-dev libx11-dev libxcb1-dev \
            libxcb-shm0-dev pkg-config libasound2-dev libopus-dev \
            protobuf-compiler libclang-dev dpkg \
            libglib2.0-dev libgtk-3-dev libxdo-dev \
            libxkbcommon-dev libwayland-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew install libvpx protobuf opus pkg-config

      - name: Build release
        run: cargo build --release --bin rd-agent --bin rd-viewer --bin rd-relay

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/release/rd-agent dist/rd-agent-linux-x86_64
          cp target/release/rd-viewer dist/rd-viewer-linux-x86_64
          cp target/release/rd-relay dist/rd-relay-linux-x86_64
          chmod +x installer/linux/build-deb.sh
          bash installer/linux/build-deb.sh || true
          cp dist/linux/*.deb dist/ 2>/dev/null || true

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          cp target/release/rd-agent dist/rd-agent-macos-aarch64
          cp target/release/rd-viewer dist/rd-viewer-macos-aarch64
          cp target/release/rd-relay dist/rd-relay-macos-aarch64
          chmod +x installer/macos/create-dmg.sh
          bash installer/macos/create-dmg.sh || true
          cp dist/macos/*.dmg dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  # Windows build (separate due to complex native deps)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        run: choco install llvm protoc -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-static-v1

      - name: Install vcpkg dependencies
        run: |
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\lib\vpx.lib")) {
            cd C:\vcpkg
            git pull 2>$null
            .\bootstrap-vcpkg.bat
            .\vcpkg install libvpx:x64-windows-static opus:x64-windows-static
          }
          # env-libvpx-sys looks for 'libvpx' but vcpkg names it 'vpx'
          $libDir = "C:\vcpkg\installed\x64-windows-static\lib"
          if ((Test-Path "$libDir\vpx.lib") -and -not (Test-Path "$libDir\libvpx.lib")) {
            Copy-Item "$libDir\vpx.lib" "$libDir\libvpx.lib"
          }
        shell: pwsh

      - name: Build release
        run: cargo build --release --bin rd-agent --bin rd-viewer --bin rd-relay
        env:
          VPX_LIB_DIR: C:\vcpkg\installed\x64-windows-static\lib
          VPX_INCLUDE_DIR: C:\vcpkg\installed\x64-windows-static\include
          VPX_VERSION: "1.13.0"
          VPX_STATIC: "1"
          VPX_NO_PKG_CONFIG: "1"
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\lib"

      - name: Package
        run: |
          mkdir dist
          copy target\release\rd-agent.exe dist\rd-agent-windows-x86_64.exe
          copy target\release\rd-viewer.exe dist\rd-viewer-windows-x86_64.exe
          copy target\release\rd-relay.exe dist\rd-relay-windows-x86_64.exe
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  # Create GitHub Release when a tag is pushed
  release:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Remote Desktop ${{ github.ref_name }}"
          body: |
            ## Installation

            ### Windows
            Download `rd-agent-windows-x86_64.exe` and `rd-viewer-windows-x86_64.exe`, or run:
            ```powershell
            irm https://raw.githubusercontent.com/vdhushetty/RemoteDesktop/main/installer/install.ps1 | iex
            ```

            ### macOS
            Download the `.dmg`, or run:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vdhushetty/RemoteDesktop/main/installer/install.sh | bash
            ```

            ### Linux
            Download the `.deb` or binaries, or run:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vdhushetty/RemoteDesktop/main/installer/install.sh | bash
            ```

            ## Quick Start
            1. Run `rd-agent` on the machine you want to control
            2. Note the Device ID it prints
            3. Run `rd-viewer` on your machine
            4. Paste the Device ID and click Connect
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
